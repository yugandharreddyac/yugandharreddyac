<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="UniDocs (CSSE Study Hub) - Production Academic & Career Learning Management Platform for Computer Science & Software Engineering Students.">
  <meta name="theme-color" content="#2563EB">

  <!-- Open Graph & Social Sharing -->
  <meta property="og:title" content="UniDocs - CSSE Academic & Career Hub">
  <meta property="og:description" content="Access university notes, PYQs, GATE CSE 2027 prep, career roadmaps, coding interview sheets, and student projects.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UniDocs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Fonts & CDN Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>UniDocs — CSSE Academic & Career Portal</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #F8FAFC;
    }
    .loading-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #3B82F6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .app-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .app-subtitle {
      font-size: 13px;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading-indicator">
    <div class="spinner"></div>
    <div class="app-title">UniDocs Hub</div>
    <div class="app-subtitle">Loading academic resources...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
