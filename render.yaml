services:
  - type: web
    name: unidocs-ai-backend
    runtime: node
    plan: free
    rootDir: functions
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /health
